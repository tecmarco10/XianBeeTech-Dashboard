<!DOCTYPE html>
<html lang="en" data-theme="obsidian">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XianBee-Tech — Enterprise Digital Asset & Infrastructure Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap');

        /* =========================================================
           🎨 DUAL THEME ENGINE (OBSIDIAN DARK & PLATINUM LIGHT)
           ========================================================= */
        :root,
        [data-theme="obsidian"] {
            --bg-base: #060913;
            --bg-surface: #0f1629;
            --bg-elevated: rgba(15, 22, 41, 0.96);
            --bg-card: #141d35;
            --bg-card-hover: #1b2747;
            --bg-subtab: #11192e;
            --bg-input: #0b1120;
            --bg-soft: rgba(56, 189, 248, 0.08);

            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;

            --accent-primary: #6366f1;
            --accent-secondary: #a855f7;
            --accent-cyan: #38bdf8;
            --grad-primary: linear-gradient(135deg, #4f46e5 0%, #7c3aed 52%, #0284c7 100%);
            --grad-danger: linear-gradient(135deg, #dc2626 0%, #f43f5e 100%);
            --grad-subtle: linear-gradient(135deg, rgba(99, 102, 241, 0.22) 0%, rgba(56, 189, 248, 0.16) 100%);

            --border-subtle: rgba(148, 163, 184, 0.22);
            --border-focus: rgba(56, 189, 248, 0.65);
            --shadow-card: 0 10px 28px rgba(0, 0, 0, 0.52);
            --shadow-glow: 0 8px 24px rgba(79, 70, 229, 0.38);

            --success: #10b981;
            --warning: #fbbf24;
            --danger: #f87171;
        }

        [data-theme="platinum"] {
            --bg-base: #f1f5f9;
            --bg-surface: #ffffff;
            --bg-elevated: rgba(255, 255, 255, 0.95);
            --bg-card: #ffffff;
            --bg-card-hover: #f8fafc;
            --bg-subtab: #e2e8f0;
            --bg-input: #f8fafc;
            --bg-soft: rgba(15, 23, 42, 0.045);

            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;

            --accent-primary: #4f46e5;
            --accent-secondary: #7c3aed;
            --accent-cyan: #0284c7;
            --grad-primary: linear-gradient(135deg, #2563eb 0%, #7c3aed 55%, #0284c7 100%);
            --grad-danger: linear-gradient(135deg, #dc2626 0%, #e11d48 100%);
            --grad-subtle: linear-gradient(135deg, rgba(37, 99, 235, 0.09) 0%, rgba(124, 58, 237, 0.07) 100%);

            --border-subtle: #cbd5e1;
            --border-focus: #6366f1;
            --shadow-card: 0 4px 18px rgba(15, 23, 42, 0.06);
            --shadow-glow: 0 8px 20px rgba(79, 70, 229, 0.22);

            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            transition: background-color 0.25s ease, color 0.25s ease;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.28); border-radius: 99px; }

        /* =========================================================
           📐 SHELL LAYOUT (SIDEBAR DESKTOP + WORKSPACE + BOTTOM NAV)
           ========================================================= */
        .app-shell {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        .sidebar {
            display: none;
            flex-direction: column;
            width: 265px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border-subtle);
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 40;
            padding: 20px 14px;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px 8px 18px 8px;
            border-bottom: 1px solid var(--border-subtle);
            cursor: pointer;
        }

        .brand-orb {
            width: 40px;
            height: 40px;
            border-radius: 11px;
            background: var(--grad-primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            box-shadow: var(--shadow-glow);
            flex-shrink: 0;
        }

        .brand-name {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .brand-tag {
            font-size: 0.66rem;
            font-weight: 800;
            color: var(--accent-cyan);
            letter-spacing: 1.3px;
            text-transform: uppercase;
            display: block;
        }

        .sidebar-nav {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            overflow-y: auto;
        }

        .side-btn {
            display: flex;
            align-items: center;
            gap: 11px;
            width: 100%;
            padding: 11px 13px;
            border-radius: 11px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.86rem;
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            transition: 0.18s;
        }

        .side-btn:hover {
            color: var(--text-primary);
            background: var(--bg-soft);
        }

        .side-btn.active {
            background: var(--grad-primary);
            color: #ffffff;
            box-shadow: var(--shadow-glow);
        }

        .sidebar-footer {
            padding-top: 14px;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .rate-chip {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--success);
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 8px 10px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            padding-top: 138px;
            padding-bottom: 175px;
        }

        /* 2-ROW BOXED TOPBAR (LOCKED FIXED LIKE BOTTOM NAV) */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            background: var(--bg-elevated);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .topbar-box-brand {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-card);
        }

        .topbar-box-actions {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-focus);
            border-radius: 12px;
            padding: 7px 10px;
            display: grid;
            grid-template-columns: 1fr 1.25fr auto;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-card);
        }

        .top-pill {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 8px 11px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-family: inherit;
            transition: 0.18s;
            white-space: nowrap;
        }

        .top-pill:hover { border-color: var(--border-focus); }

        .wallet-top-pill {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: var(--success);
            font-family: 'JetBrains Mono', monospace;
        }

        .cart-top-pill {
            background: var(--grad-primary);
            color: #fff;
            border: none;
            box-shadow: var(--shadow-glow);
            padding: 8px 13px;
        }

        .notif-top-pill {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-focus);
        }

        .badge-dot {
            background: #ef4444;
            color: #fff;
            padding: 1px 6px;
            border-radius: 99px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            font-weight: 800;
        }

        .container {
            width: 100%;
            max-width: 1220px;
            margin: 0 auto;
            padding: 18px 14px;
        }

        /* =========================================================
           🗂️ SYMMETRICAL SUB-TABS GRID (ALIGNED LEFT & RIGHT)
           ========================================================= */
        .subtabs-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 18px;
        }

        @media (min-width: 640px) {
            .subtabs-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .subtab-pill {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-left: 4px solid var(--accent-cyan);
            border-bottom: 3px solid rgba(0, 0, 0, 0.55);
            color: var(--text-secondary);
            padding: 10px 8px;
            border-radius: 11px;
            font-size: 0.72rem;
            font-weight: 800;
            cursor: pointer;
            font-family: inherit;
            transition: 0.18s;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .subtab-pill:hover {
            color: var(--text-primary);
            border-color: var(--border-focus);
            border-left: 4px solid var(--accent-primary);
        }

        .subtab-pill.active {
            background-color: #4f46e5 !important;
            background-image: linear-gradient(135deg, #4f46e5 0%, #7c3aed 55%, #0284c7 100%) !important;
            color: #ffffff !important;
            border-color: rgba(56, 189, 248, 0.65);
            border-left: 4px solid #fde047;
            border-bottom: 3px solid rgba(15, 23, 42, 0.85);
            box-shadow: var(--shadow-glow);
        }

        .inpage-drawer {
            background: var(--bg-surface);
            border: 1.5px solid var(--border-focus);
            border-left: 5px solid var(--accent-cyan);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-card), var(--shadow-glow);
            animation: fadeIn 0.22s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================================================
           🃏 CARDS, WALLET 3D CARD & GRIDS (WITH 3D LEFT ACCENT)
           ========================================================= */
        .grid-cards {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 12px;
            width: 100%;
        }

        .grid-years-2col {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            width: 100%;
        }

        .grid-years-2col .item-card {
            min-width: 0;
            width: 100%;
            overflow: hidden;
        }

        @media (max-width: 520px) {
            .grid-years-2col {
                gap: 8px;
            }
            .grid-years-2col .item-card {
                padding: 10px;
                gap: 8px;
                border-radius: 14px;
            }
            .grid-years-2col .item-icon {
                height: 28px;
                padding: 0 7px;
                font-size: 0.74rem;
                border-radius: 8px;
            }
            .grid-years-2col .item-title {
                font-size: 0.8rem;
                line-height: 1.25;
            }
            .grid-years-2col .item-desc {
                font-size: 0.65rem;
                line-height: 1.35;
            }
            .grid-years-2col .price-chip {
                font-size: 0.68rem;
                padding: 3px 6px;
                border-radius: 7px;
            }
            .grid-years-2col .btn-ui {
                padding: 8px 6px;
                font-size: 0.71rem;
                min-width: 0;
            }
        }

        :root,
        [data-theme="obsidian"] {
            --cockpit-bg: linear-gradient(135deg, #24164a 0%, #11224a 50%, #2f174c 100%);
            --cockpit-row2-bg: rgba(7, 8, 13, 0.38);
            --cockpit-pill-bg: rgba(15, 23, 42, 0.82);
            --cockpit-text: #f8fafc;
            --cockpit-subtext: #cbd5e1;
            --cockpit-ledge: #1e1b4b;
            --cockpit-shadow: rgba(0, 0, 0, 0.72);
            --cockpit-vip-color: #fde047;
            --cockpit-orb-bg: #07080d;
        }

        [data-theme="platinum"] {
            --cockpit-bg: linear-gradient(135deg, #ffffff 0%, #eef2ff 52%, #e0f2fe 100%);
            --cockpit-row2-bg: rgba(226, 232, 240, 0.55);
            --cockpit-pill-bg: #ffffff;
            --cockpit-text: #0f172a;
            --cockpit-subtext: #475569;
            --cockpit-ledge: #c7d2fe;
            --cockpit-shadow: rgba(15, 23, 42, 0.12);
            --cockpit-vip-color: #b45309;
            --cockpit-orb-bg: #ffffff;
        }

        .floating-cart-bar {
            position: fixed;
            bottom: 92px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 20px);
            max-width: 620px;
            background: var(--bg-elevated);
            backdrop-filter: blur(18px);
            border: 1.5px solid var(--border-focus);
            border-bottom: 3.5px solid var(--accent-primary);
            border-radius: 15px;
            padding: 8px 12px;
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            box-shadow: var(--shadow-card), var(--shadow-glow);
            z-index: 90;
            animation: fadeIn 0.22s ease;
        }

        @media (min-width: 1100px) {
            .floating-cart-bar {
                bottom: 22px;
                left: calc(50% + 132px);
            }
        }

        .item-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-left: 4px solid var(--accent-cyan);
            border-radius: 16px;
            padding: 13px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
            min-width: 0;
            width: 100%;
            overflow: hidden;
            box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transition: 0.2s;
        }

        .item-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-focus);
            border-left: 4px solid var(--accent-primary);
            transform: translateY(-2px);
        }

        .item-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .item-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--grad-subtle);
            border: 1px solid var(--border-focus);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 800;
            flex-shrink: 0;
            color: var(--text-primary);
        }

        .item-tag {
            display: inline-block;
            font-size: 0.64rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.12);
            border: 1px solid rgba(6, 182, 212, 0.28);
            padding: 2px 8px;
            border-radius: 6px;
            margin-bottom: 5px;
        }

        .item-title {
            margin: 0 0 4px 0;
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .item-desc {
            margin: 0;
            font-size: 0.76rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .price-chip {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--success);
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.32);
            padding: 6px 10px;
            border-radius: 9px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .item-actions {
            display: flex;
            gap: 7px;
            padding-top: 11px;
            border-top: 1px solid var(--border-subtle);
            flex-wrap: wrap;
        }

        .btn-ui {
            flex: 1;
            min-width: 90px;
            padding: 10px 12px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.76rem;
            font-weight: 800;
            cursor: pointer;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.18s;
            text-decoration: none;
        }

        .btn-ui.primary {
            background-color: #4f46e5 !important;
            background-image: linear-gradient(135deg, #4f46e5 0%, #7c3aed 55%, #0284c7 100%) !important;
            color: #ffffff !important;
            box-shadow: var(--shadow-glow);
        }

        .btn-ui.buy-now {
            background: rgba(16, 185, 129, 0.16);
            color: var(--success);
            border-color: rgba(16, 185, 129, 0.45);
        }

        .btn-ui.buy-now:hover {
            background: var(--success);
            color: #ffffff;
        }

        .btn-ui.secondary {
            background: var(--bg-soft);
            color: var(--text-primary);
            border-color: var(--border-subtle);
        }

        .btn-ui.secondary:hover { border-color: var(--border-focus); }

        /* CREDENTIAL VAULT ROW */
        .cred-field-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            padding: 9px 12px;
            border-radius: 9px;
            margin-bottom: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
        }

        .cred-field-row .lbl {
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 700;
            min-width: 78px;
        }

        .cred-field-row .val {
            flex: 1;
            color: var(--text-primary);
            font-weight: 700;
            word-break: break-all;
        }

        /* TELEGRAM-STYLE NOTIFICATION CARD IN WEB */
        .tg-notif-card {
            background: var(--bg-input);
            border: 1px solid var(--border-focus);
            border-left: 4px solid var(--accent-cyan);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            font-size: 0.8rem;
            line-height: 1.55;
            box-shadow: var(--shadow-card);
        }

        .tg-notif-card pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-primary);
        }

        /* 3D VIP WALLET CARD */
        .vip-card {
            background: var(--grad-primary);
            color: #ffffff;
            border-radius: 22px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-glow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 210px;
            margin-bottom: 20px;
        }

        .vip-chip {
            width: 42px;
            height: 30px;
            border-radius: 6px;
            background: linear-gradient(135deg, #fde047 0%, #ca8a04 100%);
        }

        .progress-track {
            width: 100%;
            height: 12px;
            background: linear-gradient(90deg, rgba(56, 189, 248, 0.16) 0%, rgba(124, 58, 237, 0.18) 100%);
            border-radius: 99px;
            overflow: hidden;
            border: 1.5px solid rgba(56, 189, 248, 0.55);
            box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.45), 0 0 12px rgba(56, 189, 248, 0.2);
            margin-top: 6px;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            min-width: 14px;
            background: linear-gradient(90deg, #06b6d4 0%, #6366f1 50%, #10b981 100%);
            background-size: 200% 100%;
            animation: xbNeonBarFlow 2.4s linear infinite;
            border-radius: 99px;
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.75);
            transition: width 0.35s ease;
        }

        @keyframes xbNeonBarFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* =========================================================
           🪟 MODALS
           ========================================================= */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.76);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border-focus);
            border-radius: 20px;
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 22px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
        }

        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);

            overflow: hidden;

            content: '';

            inset: -50%;

           ✨ SMOOTH SWIPE & SLIDE TRANSITION EFFECTS

            will-change: transform, opacity;
        }

        .page-slide-left {
            animation: slideOutLeft 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .page-slide-right {
            animation: slideOutRight 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .page-slide-in-left {
            animation: slideInLeft 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;

            animation: slideInRight 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;

            to { transform: translateX(-40px) scale(0.97); opacity: 0; }

            to { transform: translateX(40px) scale(0.97); opacity: 0; }

            from { transform: translateX(40px) scale(0.97); opacity: 0; }
            to { transform: translateX(0) scale(1); opacity: 1; }
        }
        @keyframes slideInRight {
            from { transform: translateX(-40px) scale(0.97); opacity: 0; }
            to { transform: translateX(0) scale(1); opacity: 1; }

        /* =========================================================
           💎 ASSET EXCHANGE DESIGN SYSTEM (OBSIDIAN • BLUE • PURPLE)
           ========================================================= */
        :root, [data-theme="obsidian"] {
            --bg-base: #05070e;
            --bg-surface: #0a0f1f;
            --bg-elevated: rgba(7, 10, 22, 0.95);
            --bg-card: #0c1226;
            --bg-card-hover: #121c3a;
            --bg-input: #070b17;
            --border-subtle: rgba(255, 255, 255, 0.13);
            --border-focus: rgba(96, 165, 250, 0.55);
            --ex-card-bg: linear-gradient(155deg, #070a14 0%, #0d1a3d 56%, #1f1142 100%);
            --ex-shell-bg: linear-gradient(145deg, rgba(6, 9, 20, 0.97) 0%, rgba(12, 23, 56, 0.96) 55%, rgba(28, 16, 62, 0.96) 100%);
            --ex-hairline: rgba(255, 255, 255, 0.16);
            --ex-sheen: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.65), rgba(255, 255, 255, 0.8), rgba(168, 85, 247, 0.7), transparent);
        }
        [data-theme="platinum"] {
            --bg-base: #f1f5f9;
            --bg-surface: #ffffff;
            --bg-elevated: rgba(255, 255, 255, 0.95);
            --bg-card: #ffffff;
            --bg-card-hover: #f8fafc;
            --bg-input: #f8fafc;
            --border-subtle: rgba(79, 70, 229, 0.18);
            --border-focus: rgba(37, 99, 235, 0.55);
            --ex-card-bg: linear-gradient(155deg, #ffffff 0%, #eff6ff 55%, #f5f3ff 100%);
            --ex-shell-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.97) 0%, rgba(239, 246, 255, 0.96) 55%, rgba(245, 243, 255, 0.96) 100%);
            --ex-hairline: rgba(79, 70, 229, 0.22);
            --ex-sheen: linear-gradient(90deg, transparent, rgba(37, 99, 235, 0.45), rgba(124, 58, 237, 0.5), transparent);
        }

        :root { --xb-safe-pad-bottom: 102px; }
        .main-area { padding-top: 108px !important; padding-bottom: var(--xb-safe-pad-bottom) !important; }
        .container { padding: 8px 12px 24px 12px !important; }
        #xbBottomOpaqueGuard {
            position: fixed;
            left: 0;
            right: 0;

            #xbBottomOpaqueGuard { display: none !important; }

        /* TOPBAR ASSET EXCHANGE */
        .xb-ex-topbar-shell { position: relative; width: 100%; background: var(--ex-shell-bg); border: 1px solid var(--ex-hairline); border-radius: 16px; overflow: hidden; box-shadow: 0 10px 28px rgba(0,0,0,0.44), inset 0 1px 0 rgba(255,255,255,0.22); }

        [data-theme="platinum"] .xb-ex-net-chip.active .xb-ex-net-chip-net {
            color: #0369a1;
        }
        .xb-ex-pkg-card {
            border: 1.5px solid rgba(56, 189, 248, 0.24) !important;
            border-radius: 10px !important;
            padding: 8px 4px !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 2px !important;
            position: relative;
        }

        /* 2-COLUMN TOKEN & NETWORK PICKER + ADMIN VISIBILITY MANAGER */
        .xb-ex-tok-grid-2 {
            display: grid !important;
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
            gap: 6px !important;
            max-height: 55vh;
            overflow-y: auto;
            padding-right: 2px;
        }
        .xb-ex-tok-card2 {
            width: 100%;
            min-width: 0;
            padding: 7px 8px;
            border-radius: 10px;
            border: 1.5px solid var(--ex-hairline);
            background: var(--bg-input);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left;
        }
        .xb-ex-tok-card2.active {
            border-color: #f43f5e;
            background: linear-gradient(145deg, rgba(15, 23, 52, 0.96), rgba(35, 16, 62, 0.92));
            box-shadow: 0 0 5px rgba(244, 63, 94, 0.36);
        }
        .xb-ex-tok-card2.is-off {
            opacity: 0.45;
            border-color: rgba(148, 163, 184, 0.2);
        }
        [data-theme="platinum"] .xb-ex-tok-card2.active {
            background: #fff1f2;
            border-color: #e11d48;
        }
        .xb-ex-adm-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            max-height: 82px;
            overflow-y: auto;
        }
        .xb-ex-adm-chip {
            padding: 4px 7px;
            border-radius: 7px;
            border: 1px solid rgba(148, 163, 184, 0.28);
            background: var(--bg-input);
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.52rem;
            font-weight: 800;
            cursor: pointer;
        }
        .xb-ex-adm-chip.on {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.14);
            color: #38bdf8;
        }
        .xb-ex-adm-btn {
            border: 1px solid rgba(244, 63, 94, 0.55);
            background: rgba(244, 63, 94, 0.14);
            color: #fb7185;
            border-radius: 7px;
            padding: 3px 7px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.52rem;
            font-weight: 800;
            cursor: pointer;
            flex-shrink: 0;
        }
        .xb-ex-pkg-card.active {
            border-color: #f43f5e !important;
            background: linear-gradient(145deg, rgba(16, 28, 66, 0.92), rgba(34, 15, 62, 0.9)) !important;
            box-shadow: 0 0 6px rgba(244, 63, 94, 0.42) !important;
        }
        [data-theme="platinum"] .xb-ex-pkg-card.active {
            background: #eff6ff !important;
            border-color: #e11d48 !important;
        }

        /* LIVE INTERACTIVE VISUAL PAYOUT CARD (CONVERT TO IDR) */
        .xb-ex-payout-card {
            position: relative;
            border-radius: 14px;
            padding: 12px 13px;
            color: #ffffff;
            border: 1.5px solid rgba(255, 255, 255, 0.24);
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.28);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .xb-ex-payout-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 16px 16px;
            pointer-events: none;
        }
        .xb-ex-payout-top, .xb-ex-payout-mid, .xb-ex-payout-bot {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .xb-ex-monogram {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.34);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            font-weight: 900;
            color: #ffffff;
            flex-shrink: 0;
        }
        .xb-ex-bank-pick-btn {
            width: 100%;
            height: 38px;
            padding: 0 11px;
            border-radius: 10px;
            border: 1.5px solid rgba(56, 189, 248, 0.42);
            background: var(--bg-input);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.72rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        /* TACTILE PIN KEYPAD INSIDE EXCHANGE MODAL */
        .xb-ex-pin-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 8px 0 10px;
        }
        .xb-ex-pin-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1.5px solid rgba(148, 163, 184, 0.5);
            background: transparent;
            transition: 0.14s ease;
        }
        .xb-ex-pin-dot.filled {
            background: #38bdf8;
            border-color: #bae6fd;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.7);
            transform: scale(1.12);
        }
        .xb-ex-pin-pad {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px;
        }
        .xb-ex-pin-key {
            height: 39px;
            border-radius: 9px;
            border: 1px solid var(--ex-hairline);
            background: var(--bg-input);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.92rem;
            font-weight: 800;
            cursor: pointer;
        }
        .xb-ex-pin-key:active {
            border-color: #f43f5e;
            background: rgba(244, 63, 94, 0.18);
            transform: scale(0.96);
        }

        /* 11. STEALTH COMMAND STUDIO — SMOOTH, CLEAN, FULL-HEIGHT MONITOR */
        .scb-root { position:relative; display:flex; flex-direction:column; gap:7px; height:100%; flex:1; min-height:0; overflow:hidden; contain:layout style; }
        .scb-hero {
            position:relative; overflow:hidden; flex-shrink:0; border-radius:13px; padding:7px 9px;
            background:linear-gradient(140deg, #070b18 0%, #0e1c42 58%, #1c103a 100%);
            border:1.8px solid #f43f5e;
            box-shadow:0 0 4px rgba(244,63,94,0.5);
            display:flex; flex-direction:column; gap:4px;
        }
        [data-theme="platinum"] .scb-hero {
            background:linear-gradient(140deg, #f8fafc 0%, #e0e7ff 58%, #ede9fe 100%);
            border-color:#e11d48; box-shadow:0 0 4px rgba(225,29,72,0.28);
        }
        .scb-hero-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
        .scb-hero-logo { width:26px; height:26px; border-radius:7px; background:rgba(5,8,18,0.88); border:1px solid rgba(255,255,255,0.22); color:#fff; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
        .scb-hero-logo svg { width:15px; height:15px; }
        .scb-hero-title { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; font-size:0.78rem; font-weight:900; color:var(--text-primary); letter-spacing:0.2px; text-align:center; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .scb-close-btn { width:26px; height:26px; border-radius:7px; border:1px solid rgba(255,255,255,0.18); background:rgba(15,23,42,0.65); color:#f8fafc; font-size:0.7rem; font-weight:800; cursor:pointer; flex-shrink:0; }
        [data-theme="platinum"] .scb-close-btn { background:#fff; color:#0f172a; border-color:rgba(15,23,42,0.18); }
        .scb-hero-meta { display:flex; align-items:center; justify-content:center; gap:5px; font-family:'JetBrains Mono',monospace; font-size:0.48rem; font-weight:800; }
        .scb-badge { padding:2px 7px; border-radius:99px; border:1px solid rgba(56,189,248,0.36); background:rgba(7,12,26,0.72); color:#7dd3fc; display:inline-flex; align-items:center; gap:4px; }
        [data-theme="platinum"] .scb-badge { background:#ffffff; color:#0369a1; border-color:rgba(2,132,199,0.32); }
        .scb-dot { width:6px; height:6px; border-radius:50%; background:#34d399; }
        .scb-dot.off { background:#f87171; }

        .scb-nav { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:4px; flex-shrink:0; background:var(--bg-input); border:1px solid var(--ex-hairline); border-radius:10px; padding:3px; }
        .scb-nav-btn { border:1.5px solid transparent; background:transparent; color:var(--text-secondary); border-radius:7px; padding:6px 3px; font-family:'JetBrains Mono',monospace; font-size:0.56rem; font-weight:800; cursor:pointer; white-space:nowrap; }
        .scb-nav-btn.active { background:linear-gradient(135deg,#0e1e44,#241348); border-color:#f43f5e; color:#ffffff; }
        [data-theme="platinum"] .scb-nav-btn.active { background:#ffffff; border-color:#e11d48; color:#0f172a; }

        .scb-scroll { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y; transform:translateZ(0); display:flex; flex-direction:column; gap:7px; }
        .scb-scroll.is-fill { overflow:hidden; }

        /* 8-MODULE COMPACT SWITCHER (2 ROWS x 4 COLS, RAMPING & SEJAJAR) */
        .scb-mod-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:5px; flex-shrink:0; }
        .scb-mod-pill {
            position:relative; height:36px; border:1px solid rgba(148,163,184,0.22); background:var(--bg-input); color:var(--text-secondary);
            border-radius:8px; padding:0 4px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:4px;
            font-family:'JetBrains Mono',monospace; font-size:0.53rem; font-weight:800; white-space:nowrap;
        }
        .scb-mod-pill .mi { font-size:0.72rem; line-height:1; }
        .scb-mod-pill.active { border:1.5px solid #f43f5e; color:#ffffff; background:linear-gradient(135deg,#0f1f48,#26134a); }
        [data-theme="platinum"] .scb-mod-pill.active { background:#fff1f2; border-color:#e11d48; color:#0f172a; }

        /* SINGLE CLEAN TERMINAL CARD */
        .scb-term-card {
            position:relative; background:var(--ex-card-bg);
            border:1.5px solid rgba(56,189,248,0.42); border-radius:14px; padding:10px;
            display:flex; flex-direction:column; gap:8px;
        }
        .scb-term-card.is-monitor { flex:1; min-height:0; height:100%; overflow:hidden; }
        .scb-term-hdr { display:flex; align-items:center; justify-content:space-between; gap:8px; padding-bottom:6px; border-bottom:1px solid rgba(148,163,184,0.16); flex-shrink:0; }
        .scb-term-title { display:flex; align-items:center; gap:6px; font-size:0.75rem; font-weight:900; color:var(--text-primary); }
        .scb-live-tag { font-family:'JetBrains Mono',monospace; font-size:0.48rem; font-weight:800; padding:2px 7px; border-radius:99px; border:1px solid rgba(52,211,153,0.45); background:rgba(16,185,129,0.1); color:#34d399; white-space:nowrap; }
        .scb-lbl { font-family:'JetBrains Mono',monospace; font-size:0.51rem; font-weight:800; color:var(--text-muted); display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }

        /* UNIFORM COMPACT BUTTON GRIDS (ZERO ORPHAN GAPS, DISCIPLINED PALETTE) */
        .scb-grid-4 { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:5px; }
        .scb-grid-3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px; }
        .scb-grid-2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px; }
        .scb-span-full { grid-column:1 / -1; }

        .scb-opt-box {
            position:relative; min-height:32px; border-radius:8px; padding:6px 5px; cursor:pointer;
            display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; text-align:center;
            border:1px solid rgba(148,163,184,0.24); background:var(--bg-input); color:var(--text-secondary);
            font-family:'JetBrains Mono',monospace;
        }
        .scb-opt-box.is-row { flex-direction:row; gap:5px; padding:6px 8px; }
        .scb-opt-box .oi { font-size:0.74rem; line-height:1; }
        .scb-opt-box .ot { font-size:0.55rem; font-weight:800; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
        .scb-opt-box .os { font-size:0.46rem; font-weight:700; opacity:0.72; line-height:1.1; }
        .scb-opt-box.active {
            border:1.5px solid #38bdf8; color:#ffffff;
            background:linear-gradient(135deg, rgba(14,34,74,0.95), rgba(32,18,68,0.95));
        }
        .scb-opt-box.active .ot { color:#e0f2fe; }
        .scb-opt-box.active .os { color:#7dd3fc; opacity:0.95; }
        [data-theme="platinum"] .scb-opt-box.active { background:#eff6ff; border-color:#2563eb; color:#0f172a; }
        [data-theme="platinum"] .scb-opt-box.active .ot { color:#0f172a; }
        [data-theme="platinum"] .scb-opt-box.active .os { color:#2563eb; }

        /* SUBTLE ACTIVE ACCENTS FOR BOOST METRICS / ACTIONS ONLY */
        .scb-opt-box.acc-red.active   { border-color:#f43f5e; background:rgba(244,63,94,0.16); color:#fda4af; }
        .scb-opt-box.acc-red.active .ot { color:#ffe4e6; }
        .scb-opt-box.acc-green.active { border-color:#10b981; background:rgba(16,185,129,0.16); color:#a7f3d0; }
        .scb-opt-box.acc-green.active .ot { color:#ecfdf5; }
        .scb-opt-box.acc-gold.active  { border-color:#f59e0b; background:rgba(245,158,11,0.16); color:#fde68a; }
        .scb-opt-box.acc-gold.active .ot { color:#fef3c7; }
        .scb-opt-box.acc-purple.active { border-color:#a855f7; background:rgba(168,85,247,0.16); color:#e9d5ff; }
        .scb-opt-box.acc-purple.active .ot { color:#f3e8ff; }

        .scb-act-btn {
            height:32px; border-radius:8px; cursor:pointer; font-family:'JetBrains Mono',monospace; font-size:0.57rem; font-weight:800;
            display:inline-flex; align-items:center; justify-content:center; gap:5px; padding:0 8px;
            border:1px solid rgba(148,163,184,0.28); background:var(--bg-input); color:var(--text-primary);
        }
        .scb-act-btn.danger { border-color:rgba(244,63,94,0.48); color:#fb7185; background:rgba(244,63,94,0.08); }
        .scb-act-btn.cyan   { border-color:rgba(56,189,248,0.48); color:#38bdf8; background:rgba(56,189,248,0.08); }
        .scb-act-btn.green  { border-color:rgba(16,185,129,0.52); color:#34d399; background:rgba(16,185,129,0.1); }

        /* INPUTS, QUANTITY PILLS & PAT TRIGGER */
        .scb-inp-row { display:flex; align-items:center; gap:5px; }
        .scb-inp { width:100%; height:34px; background:var(--bg-input); border:1px solid rgba(56,189,248,0.38); border-radius:8px; padding:0 9px; color:var(--text-primary); font-family:'JetBrains Mono',monospace; font-size:0.65rem; font-weight:700; outline:none; box-sizing:border-box; }
        .scb-inp:focus { border-color:#38bdf8; }
        .scb-inp[type="date"] { color-scheme: dark; }
        [data-theme="platinum"] .scb-inp[type="date"] { color-scheme: light; }
        .scb-paste-btn { height:34px; padding:0 9px; border-radius:8px; border:1px solid rgba(56,189,248,0.42); background:rgba(56,189,248,0.1); color:#38bdf8; font-family:'JetBrains Mono',monospace; font-size:0.55rem; font-weight:800; cursor:pointer; flex-shrink:0; }

        .scb-qty-row { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:5px; }
        .scb-qty-pill { height:28px; border-radius:7px; border:1px solid rgba(148,163,184,0.26); background:var(--bg-input); color:var(--text-secondary); font-family:'JetBrains Mono',monospace; font-size:0.54rem; font-weight:800; cursor:pointer; }
        .scb-qty-pill.active { background:linear-gradient(135deg,#0f1f48,#26134a); border:1.5px solid #38bdf8; color:#ffffff; }
        [data-theme="platinum"] .scb-qty-pill.active { background:#eff6ff; color:#1d4ed8; }

        .scb-pat-bar {
            width:100%; height:36px; padding:0 10px; border-radius:9px; cursor:pointer;
            background:var(--bg-input); border:1px solid rgba(56,189,248,0.4);
            display:flex; align-items:center; justify-content:space-between; gap:8px;
            font-family:'JetBrains Mono',monospace;
        }
        .scb-pat-bar.ready { border-color:rgba(52,211,153,0.55); background:rgba(16,185,129,0.08); }

        .scb-summary {
            background:rgba(5,9,20,0.55); border:1px solid rgba(52,211,153,0.38); border-radius:9px; padding:7px 9px;
            display:flex; flex-direction:column; gap:4px; font-family:'JetBrains Mono',monospace; font-size:0.55rem;
        }
        [data-theme="platinum"] .scb-summary { background:#f8fafc; }
        .scb-srow { display:flex; justify-content:space-between; align-items:center; gap:8px; color:var(--text-secondary); }
        .scb-srow b { color:var(--text-primary); text-align:right; }
