<!DOCTYPE html>
<html lang="en" data-theme="obsidian">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XianBee-Tech — Enterprise Digital Asset & Infrastructure Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap');

        /* =========================================================
           🎨 DUAL THEME ENGINE (OBSIDIAN DARK & PLATINUM LIGHT)
           ========================================================= */
        :root,
        [data-theme="obsidian"] {
            --bg-base: #07080d;
            --bg-surface: #0f111a;
            --bg-elevated: rgba(17, 20, 31, 0.92);
            --bg-card: rgba(22, 26, 40, 0.80);
            --bg-card-hover: rgba(31, 36, 56, 0.96);
            --bg-subtab: rgba(13, 15, 24, 0.94);
            --bg-input: #0b0d14;
            --bg-soft: rgba(255, 255, 255, 0.045);

            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;

            --accent-primary: #6366f1;
            --accent-secondary: #8b5cf6;
            --accent-cyan: #06b6d4;
            --grad-primary: linear-gradient(135deg, #4f46e5 0%, #7c3aed 52%, #06b6d4 100%);
            --grad-danger: linear-gradient(135deg, #dc2626 0%, #f43f5e 100%);
            --grad-subtle: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(6, 182, 212, 0.10) 100%);

            --border-subtle: rgba(255, 255, 255, 0.085);
            --border-focus: rgba(99, 102, 241, 0.58);
            --shadow-card: 0 8px 28px rgba(0, 0, 0, 0.38);
            --shadow-glow: 0 8px 24px rgba(99, 102, 241, 0.28);

            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        [data-theme="platinum"] {
            --bg-base: #f1f5f9;
            --bg-surface: #ffffff;
            --bg-elevated: rgba(255, 255, 255, 0.94);
            --bg-card: #ffffff;
            --bg-card-hover: #f8fafc;
            --bg-subtab: #e2e8f0;
            --bg-input: #f8fafc;
            --bg-soft: rgba(15, 23, 42, 0.045);

            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;

            --accent-primary: #4f46e5;
            --accent-secondary: #7c3aed;
            --accent-cyan: #0284c7;
            --grad-primary: linear-gradient(135deg, #2563eb 0%, #7c3aed 55%, #0284c7 100%);
            --grad-danger: linear-gradient(135deg, #dc2626 0%, #e11d48 100%);
            --grad-subtle: linear-gradient(135deg, rgba(37, 99, 235, 0.09) 0%, rgba(124, 58, 237, 0.07) 100%);

            --border-subtle: #cbd5e1;
            --border-focus: #6366f1;
            --shadow-card: 0 4px 18px rgba(15, 23, 42, 0.06);
            --shadow-glow: 0 8px 20px rgba(79, 70, 229, 0.22);

            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            transition: background-color 0.25s ease, color 0.25s ease;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.28); border-radius: 99px; }

        /* =========================================================
           📐 SHELL LAYOUT (SIDEBAR DESKTOP + WORKSPACE + BOTTOM NAV)
           ========================================================= */
        .app-shell {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        .sidebar {
            display: none;
            flex-direction: column;
            width: 265px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border-subtle);
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 40;
            padding: 20px 14px;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px 8px 18px 8px;
            border-bottom: 1px solid var(--border-subtle);
            cursor: pointer;
        }

        .brand-orb {
            width: 40px;
            height: 40px;
            border-radius: 11px;
            background: var(--grad-primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            box-shadow: var(--shadow-glow);
            flex-shrink: 0;
        }

        .brand-name {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .brand-tag {
            font-size: 0.66rem;
            font-weight: 800;
            color: var(--accent-cyan);
            letter-spacing: 1.3px;
            text-transform: uppercase;
            display: block;
        }

        .sidebar-nav {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            overflow-y: auto;
        }

        .side-btn {
            display: flex;
            align-items: center;
            gap: 11px;
            width: 100%;
            padding: 11px 13px;
            border-radius: 11px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.86rem;
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            transition: 0.18s;
        }

        .side-btn:hover {
            color: var(--text-primary);
            background: var(--bg-soft);
        }

        .side-btn.active {
            background: var(--grad-primary);
            color: #ffffff;
            box-shadow: var(--shadow-glow);
        }

        .sidebar-footer {
            padding-top: 14px;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .rate-chip {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--success);
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 8px 10px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            padding-bottom: 84px;
        }

        /* TOPBAR */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 30;
            height: 64px;
            background: var(--bg-elevated);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .search-bar {
            flex: 1;
            max-width: 420px;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 9px 12px 9px 34px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            outline: none;
        }

        .search-bar input:focus { border-color: var(--border-focus); }
        .search-bar .s-ic {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.82rem;
            color: var(--text-muted);
            pointer-events: none;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .top-pill {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 7px 11px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-family: inherit;
            transition: 0.18s;
        }

        .top-pill:hover { border-color: var(--border-focus); }

        .wallet-top-pill {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: var(--success);
            font-family: 'JetBrains Mono', monospace;
        }

        .cart-top-pill {
            background: var(--grad-primary);
            color: #fff;
            border: none;
            box-shadow: var(--shadow-glow);
        }

        .cart-count-badge {
            background: rgba(0, 0, 0, 0.35);
            color: #fff;
            padding: 1px 6px;
            border-radius: 99px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
        }

        .container {
            width: 100%;
            max-width: 1220px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        /* =========================================================
           🗂️ NESTED SUB-TABS & IN-PAGE VAULT INSPECTOR
           ========================================================= */
        .subtabs-wrap {
            background: var(--bg-subtab);
            border: 1px solid var(--border-subtle);
            padding: 7px;
            border-radius: 13px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 18px;
        }

        .subtab-pill {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            padding: 7px 13px;
            border-radius: 9px;
            font-size: 0.76rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: 0.15s;
        }

        .subtab-pill:hover { color: var(--text-primary); background: var(--bg-soft); }
        .subtab-pill.active {
            background: var(--grad-primary);
            color: #ffffff;
            box-shadow: var(--shadow-glow);
        }

        .inpage-drawer {
            background: var(--bg-surface);
            border: 1.5px solid var(--border-focus);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-glow);
            animation: fadeIn 0.22s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================================================
           🃏 CARDS, WALLET 3D CARD & GRIDS
           ========================================================= */
        .grid-cards {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }

        .item-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 14px;
            box-shadow: var(--shadow-card);
            transition: 0.2s;
        }

        .item-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-focus);
            transform: translateY(-2px);
        }

        .item-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .item-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--grad-subtle);
            border: 1px solid var(--border-focus);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 800;
            flex-shrink: 0;
            color: var(--text-primary);
        }

        .item-tag {
            display: inline-block;
            font-size: 0.64rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.12);
            border: 1px solid rgba(6, 182, 212, 0.28);
            padding: 2px 8px;
            border-radius: 6px;
            margin-bottom: 5px;
        }

        .item-title {
            margin: 0 0 4px 0;
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .item-desc {
            margin: 0;
            font-size: 0.76rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .price-chip {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--success);
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.32);
            padding: 6px 10px;
            border-radius: 9px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .item-actions {
            display: flex;
            gap: 7px;
            padding-top: 11px;
            border-top: 1px solid var(--border-subtle);
            flex-wrap: wrap;
        }

        .btn-ui {
            flex: 1;
            min-width: 90px;
            padding: 10px 12px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.76rem;
            font-weight: 800;
            cursor: pointer;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.18s;
            text-decoration: none;
        }

        .btn-ui.primary {
            background: var(--grad-primary);
            color: #ffffff;
            box-shadow: var(--shadow-glow);
        }

        .btn-ui.buy-now {
            background: rgba(16, 185, 129, 0.16);
            color: var(--success);
            border-color: rgba(16, 185, 129, 0.45);
        }

        .btn-ui.buy-now:hover {
            background: var(--success);
            color: #ffffff;
        }

        .btn-ui.secondary {
            background: var(--bg-soft);
            color: var(--text-primary);
            border-color: var(--border-subtle);
        }

        .btn-ui.secondary:hover { border-color: var(--border-focus); }

        /* CREDENTIAL VAULT ROW */
        .cred-field-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            padding: 9px 12px;
            border-radius: 9px;
            margin-bottom: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
        }

        .cred-field-row .lbl {
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 700;
            min-width: 78px;
        }

        .cred-field-row .val {
            flex: 1;
            color: var(--text-primary);
            font-weight: 700;
            word-break: break-all;
        }

        /* 3D VIP WALLET CARD */
        .vip-card {
            background: var(--grad-primary);
            color: #ffffff;
            border-radius: 22px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-glow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 210px;
            margin-bottom: 20px;
        }

        .vip-chip {
            width: 42px;
            height: 30px;
            border-radius: 6px;
            background: linear-gradient(135deg, #fde047 0%, #ca8a04 100%);
        }

        .progress-track {
            width: 100%;
            height: 9px;
            background: var(--bg-input);
            border-radius: 99px;
            overflow: hidden;
            border: 1px solid var(--border-subtle);
            margin-top: 6px;
        }

        .progress-fill {
            height: 100%;
            background: var(--grad-primary);
            border-radius: 99px;
        }

        /* =========================================================
           🪟 MODALS
           ========================================================= */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.76);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            pointer-events: none;
            transition: 0.22s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border-focus);
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 22px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
        }

        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 12px 14px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            outline: none;
        }

        .form-input:focus { border-color: var(--border-focus); }

        /* BOTTOM NAVIGATION BAR */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 66px;
            background: var(--bg-elevated);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 50;
            padding: 0 4px;
        }

        .bnav-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 0.67rem;
            font-weight: 800;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            padding: 6px 2px;
        }

        .bnav-btn.active { color: var(--accent-cyan); }

        .toast-msg {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--grad-primary);
            color: #fff;
            padding: 11px 22px;
            border-radius: 99px;
            font-size: 0.82rem;
            font-weight: 800;
            box-shadow: var(--shadow-glow);
            z-index: 9999;
            transition: 0.3s ease;
        }

        .toast-msg.show { transform: translateX(-50%) translateY(0); }

        @media (min-width: 768px) {
            .grid-cards { grid-template-columns: repeat(2, 1fr); }
        }

        @media (min-width: 1100px) {
            .sidebar { display: flex; }
            .main-area { margin-left: 265px; padding-bottom: 40px; }
            .bottom-nav { display: none; }
            .grid-cards { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

    <div class="toast-msg" id="toastBanner">✅ Action completed</div>

    <div class="app-shell">
        <!-- 🖥️ DESKTOP SIDEBAR -->
        <aside class="sidebar">
            <div class="brand-box" onclick="switchTab('home')">
                <div class="brand-orb">🐝</div>
                <div>
                    <h2 class="brand-name">XianBee-Tech</h2>
                    <span class="brand-tag">Enterprise Hub</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <button class="side-btn active" data-tab="home" onclick="switchTab('home')">🏠 Dashboard Home</button>
                <button class="side-btn" data-tab="github" onclick="switchTab('github')">🐙 GitHub Enterprise Hub</button>
                <button class="side-btn" data-tab="catalog" onclick="switchTab('catalog')">🌐 All Store Catalogs</button>
                <button class="side-btn" data-tab="wallet" onclick="switchTab('wallet')">💳 Wallet & Deposit</button>
                <button class="side-btn" data-tab="profile" onclick="switchTab('profile')">👤 Profile & Purchased Vault</button>
                <button class="side-btn" data-tab="admin" onclick="switchTab('admin')" style="color:var(--warning);">👑 Command Center</button>
            </nav>

            <div class="sidebar-footer">
                <div class="rate-chip">
                    <span>1 USDT LIVE:</span>
                    <span id="liveRateSidebar">Rp ...</span>
                </div>
            </div>
        </aside>

        <!-- 📱 MAIN WORKSPACE -->
        <div class="main-area">
            <header class="topbar">
                <div class="search-bar">
                    <span class="s-ic">🔍</span>
                    <input type="text" id="globalSearch" placeholder="Search GitHub 2012, @username, Stars, Canva Pro..." oninput="handleSearch(this.value)">
                </div>

                <div class="topbar-right">
                    <!-- REAL-TIME USDT <-> IDR SWITCHER -->
                    <button class="top-pill" onclick="toggleCurrency()" title="Switch between USDT and Real-Time IDR">
                        <span>💱</span>
                        <span id="currSwitchText">USDT</span>
                    </button>

                    <!-- WALLET BALANCE PILL -->
                    <button class="top-pill wallet-top-pill" onclick="switchTab('wallet')">
                        <span>💳</span>
                        <span id="topBalanceText">0.00 USDT</span>
                    </button>

                    <!-- THEME SWITCHER -->
                    <button class="top-pill" onclick="toggleTheme()">
                        <span id="themeIcon">☀️</span>
                    </button>

                    <!-- ADMIN QUICK ACCESS -->
                    <button class="top-pill" onclick="switchTab('admin')" title="Command Center">👑</button>

                    <!-- CART BUTTON -->
                    <button class="top-pill cart-top-pill" onclick="openCartModal()">
                        <span>🛒</span>
                        <span class="cart-count-badge" id="cartCountBadge">0</span>
                    </button>
                </div>
            </header>

            <div class="container">
                <!-- NESTED SUB-TABS BAR (LEVEL 2) -->
                <div class="subtabs-wrap" id="subTabsContainer"></div>

                <!-- IN-PAGE VAULT DRAWER (LEVEL 3 — FOR INSPECTING SPECIFIC GITHUB ACCOUNTS) -->
                <div id="inPageVaultDrawer" style="display:none;"></div>

                <!-- MAIN DYNAMIC VIEWPORT -->
                <div id="mainViewport"></div>
            </div>
        </div>

        <!-- 📱 MOBILE BOTTOM NAVIGATION -->
        <nav class="bottom-nav">
            <button class="bnav-btn active" data-tab="home" onclick="switchTab('home')">
                <span style="font-size:1.18rem;">🏠</span>
                <span>Home</span>
            </button>
            <button class="bnav-btn" data-tab="github" onclick="switchTab('github')">
                <span style="font-size:1.18rem;">🐙</span>
                <span>GitHub</span>
            </button>
            <button class="bnav-btn" data-tab="catalog" onclick="switchTab('catalog')">
                <span style="font-size:1.18rem;">🌐</span>

        function computeAccountPrice(acc, catKey) {
            if (acc.price_usd && parseFloat(acc.price_usd) > 0) {
                return parseFloat(acc.price_usd);
            }
            const yrStr = String(acc.year || catKey || '2026');
            const baseYr = BASE_YEAR_PRICES[yrStr] || 4.5;
            const catExtra = (catKey === 'Arctic') ? 25.0 : 0.0;
            const follExtra = (parseInt(acc.followers || 0) || 0) * 0.15;
            return baseYr + catExtra + follExtra;
        }

        async function syncGoogleSheetInventory(notify = false) {
            try {
                const res = await fetch(GSHEET_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'pull_stock' })
                });
                const json = await res.json();
                if (json && json.result && Array.isArray(json.data)) {
                    const grouped = {};
                    const flat = [];
                    json.data.forEach(acc => {
                        const cat = String(acc.category || acc.year || '2026');
                        acc._computed_usdt = computeAccountPrice(acc, cat);
                        acc._cat_key = cat;
                        if (!grouped[cat]) grouped[cat] = [];
                        grouped[cat].push(acc);
                        flat.push(acc);
                    });
                    // Populate special "Followers" virtual category (accounts with >= 50 followers)
                    grouped['Followers'] = flat.filter(a => (parseInt(a.followers || 0) || 0) >= 50);

                    liveGithubStock = grouped;
                    allLiveAccountsFlat = flat;
                    totalLiveAccounts = flat.length;
                    if (activeTab === 'home' || activeTab === 'github') renderViewport();
                    if (notify) showToast(`Synced ${totalLiveAccounts} live accounts from Google Sheet!`);

        function savePurchasedAccountsToWebVault(itemsList, invId) {
            const vault = JSON.parse(localStorage.getItem('xb_purchased_vault') || '[]');
            const unlockedAccounts = [];

            itemsList.forEach(item => {
                if (item.isAccount && item.accountData) {
                    const acc = item.accountData;
                    const entry = {
                        invoice: invId,
                        date: new Date().toLocaleString('en-US', { year: 'numeric', month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
                        category: item.yearKey || acc.category || acc.year || 'GitHub',
                        username: acc.username || '-',
                        password: acc.password || '-',
                        twofa: acc.twofa || '-',
                        email: acc.email || '-',
                        url: acc.url || `https://github.com/${acc.username}`,
                        followers: acc.followers || 0,
                        repos: acc.repos || 0,
                        priceUsdt: parseFloat(item.usdt || 0).toFixed(2)
                    };
                    vault.unshift(entry);
                    unlockedAccounts.push(entry);

                    // Mark SOLD OUT in Google Sheet immediately & remove from local available pool
                    markAccountSoldInGSheet(acc.username, item.usdt, invId);
                    allLiveAccountsFlat = allLiveAccountsFlat.filter(a => a.username.toLowerCase() !== acc.username.toLowerCase());
                    Object.keys(liveGithubStock).forEach(k => {
                        liveGithubStock[k] = (liveGithubStock[k] || []).filter(a => a.username.toLowerCase() !== acc.username.toLowerCase());
                    });
                }
            });

            localStorage.setItem('xb_purchased_vault', JSON.stringify(vault.slice(0, 100)));
            return unlockedAccounts;
        }

        function base32Decode(str) {
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
            const clean = str.toUpperCase().replace(/[^A-Z2-7]/g, "");
            let bits = "";
            for (let i = 0; i < clean.length; i++) bits += alphabet.indexOf(clean[i]).toString(2).padStart(5, "0");
            const out = [];
            for (let i = 0; i + 8 <= bits.length; i += 8) out.push(parseInt(bits.substring(i, i + 8), 2));
            return new Uint8Array(out);
        }

        async function generateTotpCode(secret) {
            const key = base32Decode(secret);
            if (!key.length) throw new Error("Invalid key");
            const counter = Math.floor(Date.now() / 1000 / 30);
            const buf = new ArrayBuffer(8);
            new DataView(buf).setUint32(4, counter, false);
            const cryptoKey = await crypto.subtle.importKey("raw", key, { name: "HMAC", hash: "SHA-1" }, false, ["sign"]);
            const hmac = new Uint8Array(await crypto.subtle.sign("HMAC", cryptoKey, buf));
            const offset = hmac[hmac.length - 1] & 0x0f;
            const bin = ((hmac[offset] & 0x7f) << 24) | ((hmac[offset + 1] & 0xff) << 16) | ((hmac[offset + 2] & 0xff) << 8) | (hmac[offset + 3] & 0xff);
            return (bin % 1000000).toString().padStart(6, "0");
        }

            async function updateOtp() {
                try {
                    const code = await generateTotpCode(s);
                    const rem = 30 - (Math.floor(Date.now() / 1000) % 30);
                    document.getElementById('web2faCode').innerText = code;
                    document.getElementById('web2faTimer').innerText = `Expires in ${rem}s (Auto-Refreshing)`;
                } catch (e) {
                    document.getElementById('web2faCode').innerText = 'INVALID';
                }
            }
            await updateOtp();
            if (otpIntervalId) clearInterval(otpIntervalId);
            otpIntervalId = setInterval(updateOtp, 1000);
        }

                    const d = await r.json();
                    const yr = d.created_at ? parseInt(d.created_at.substring(0, 4)) : 2026;
                    const baseP = BASE_YEAR_PRICES[String(yr)] || 15;
                    const estVal = baseP + (d.followers * 0.15) + (d.public_repos * 0.05);
                    out.innerHTML = `
                        <div style="padding:14px;border-radius:12px;background:var(--bg-soft);border:1px solid var(--success);display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
                            <img src="${d.avatar_url}" style="width:52px;height:52px;border-radius:50%;border:2px solid var(--success);">
                            <div style="flex:1;">
                                <div style="font-weight:800;color:var(--success);">🟢 ACCOUNT HEALTHY (200 OK) — @${d.login} (Year ${yr})</div>
                                <div style="font-size:0.78rem;color:var(--text-secondary);margin-top:3px;">
                                    👥 Followers: <b>${d.followers}</b> • 📁 Repos: <b>${d.public_repos}</b> • 🧮 Est. Market Valuation: <b style="color:var(--success);">${fmtPrice(estVal)}</b>
                                </div>
                            </div>
                        </div>
                    `;
                }
            } catch (e) {
                out.innerHTML = `<div style="color:var(--danger);font-weight:700;">❌ Target not found on GitHub!</div>`;
            }
        }

        async function checkLiveGithubBoost() {
            const raw = document.getElementById('profBoostInput').value.trim();
            if (!raw) return showToast('Enter a GitHub username or owner/repo!');
            const clean = raw.replace('https://github.com/', '').replace('@', '').replace(/\/$/, '');
            const out = document.getElementById('profBoostOutput');
            out.innerHTML = `<div>🔄 Fetching live metrics from GitHub...</div>`;
            try {
                if (clean.includes('/')) {
                    const r = await fetch(`https://api.github.com/repos/${clean}`);
                    if (!r.ok) throw new Error('404');
                    const d = await r.json();
                    out.innerHTML = `<div style="padding:14px;border-radius:12px;background:var(--bg-soft);border:1px solid var(--success);font-weight:700;">📦 Repo: <b>${d.full_name}</b> — ⭐ Stars: <b>${d.stargazers_count}</b> | ⎇ Forks: <b>${d.forks_count}</b> | 👁️ Watchers: <b>${d.subscribers_count || d.watchers_count}</b></div>`;
                } else {
                    const r = await fetch(`https://api.github.com/users/${clean}`);
                    if (!r.ok) throw new Error('404');
                    const d = await r.json();
                    out.innerHTML = `<div style="padding:14px;border-radius:12px;background:var(--bg-soft);border:1px solid var(--success);font-weight:700;">👤 User: <b>@${d.login}</b> — 👥 Live Followers: <b>${d.followers} Followers</b> | 📁 Public Repos: <b>${d.public_repos}</b></div>`;
                }
            } catch (e) {
                out.innerHTML = `<div style="color:var(--danger);font-weight:700;">❌ Target not found!</div>`;
            }
        }

        // =========================================================
        // 🛒 12. CART MODAL & BOT BRIDGE HELPERS
        // =========================================================
        function openCartModal() {
            const box = document.getElementById('cartItemsContainer');
            if (cart.length === 0) {
                box.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text-muted);font-weight:700;">Your shopping cart is empty.</div>`;
                document.getElementById('cartGrandTotal').innerText = fmtPrice(0);
            } else {
                let sum = 0;
                box.innerHTML = cart.map((c, idx) => {
                    sum += c.usdt;
                    return `
                        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;background:var(--bg-soft);border:1px solid var(--border-subtle);margin-bottom:8px;">
                            <div style="flex:1;min-width:0;padding-right:8px;">
                                <div style="font-size:0.84rem;font-weight:800;">${c.title}</div>
                                <div style="font-size:0.72rem;color:var(--text-muted);font-family:'JetBrains Mono',monospace;">${c.target}</div>
                            </div>
                            <div style="display:flex;align-items:center;gap:8px;">
                                <span style="font-family:'JetBrains Mono',monospace;font-weight:800;color:var(--success);">${fmtPrice(c.usdt)}</span>
                                <button class="top-pill" style="color:var(--danger);padding:4px 8px;" onclick="cart.splice(${idx},1); updateCartUI(); openCartModal();">🗑️</button>
                            </div>
                        </div>
                    `;
                }).join('');
                const finalUsdt = sum * (1 - cartDiscountPct / 100);
                document.getElementById('cartGrandTotal').innerText = fmtPrice(finalUsdt);
            }
            document.getElementById('cartUserBal').innerText = fmtPrice(userBalanceUsdt);
            document.getElementById('cartModal').classList.add('active');
        }

        function applyCartVoucher() {
            const code = document.getElementById('cartPromoInput').value.trim().toUpperCase();
            if (code === 'XIANBEE5' || code === 'VIP5') {
                cartDiscountPct = 5;
                openCartModal();
                showToast('5% Discount Voucher Applied!');
            } else {
                showToast('Invalid voucher code!');
            }
        }

        function claimWalletVoucher() {
            const code = document.getElementById('walletPromoInput').value.trim().toUpperCase();
            if (code === 'XIANBEE5' || code === 'VIP5') {
                cartDiscountPct = 5;
                showToast('5% Discount Voucher Activated for your next checkout!');
            } else {
                showToast('Invalid or expired promo code!');
            }
        }

        function syncBalanceWithBot() {
            sendPayloadToBot('REFRESH_BALANCE', {}, false);
            showToast('Balance sync signal sent!');
        }

        function sendPayloadToBot(action, extra = {}) {
            try {
                if (tg && tg.sendData) {
                    tg.sendData(JSON.stringify({ action: action, ...extra }));
                }
            } catch (e) {}
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        let toastTimeout = null;
        function showToast(msg) {
            const t = document.getElementById('toastBanner');
            t.innerText = '⚡ ' + msg;
            t.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => t.classList.remove('show'), 2600);
        }

        // Initial Render
        switchTab('home');
    </script>
</body>
</html>
